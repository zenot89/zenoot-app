<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.min.js"></script>
<script>
  // BUILD VERSION — di-set saat deploy, TIDAK berubah setiap page load.
  // Date.now() sebagai versi menyebabkan SW cache miss setiap saat karena
  // URL berubah terus (?v=timestamp_baru). Akibatnya semua JS harus fetch
  // ulang dari network setiap buka app → blank page kalau network lambat/offline.
  //
  // Cara update versi (wajib setiap deploy baru):
  //   Ganti angka di bawah dengan Date.now() SEKALI saat deploy, lalu commit.
  //   Contoh: window.APP_BUILD = '20260610-fix-android-nw'; // ← aktif
  window.APP_BUILD = '20260816-6cb38e49caf0';
</script>
<script>
  // Sequential script loader — iOS Safari compatible
  // async=false tidak reliable di iOS saat script di-inject dinamis
  (function() {
    var v = window.APP_BUILD;
    var scripts = [
      'rough-ui.js','supabase.js','app.js','dashboard.js',
      'produk.js','stok.js','restock.js','kas.js','gadag.js',
      'jurnal-penjualan.js','produk-terjual.js','price-list.js',
      'dataorder.js','rekap.js','channel-master.js',
      'shopee-auth.js','shopee-sync.js','networth.js',
      'beban-operasional.js','anggaran.js','keuangan.js','penutupan-periode.js','clearance.js','hpp.js','notif.js','shopee-dashboard.js','proyeksi-harga.js','autocomplete.js'
    ];
    var i = 0;
    var _timer = null;

    function loadNext() {
      if (_timer) { clearTimeout(_timer); _timer = null; }
      if (i >= scripts.length) return;
      var el = document.createElement('script');
      var src = scripts[i++] + '?v=' + v;
      el.src     = src;
      el.onload  = loadNext;
      el.onerror = loadNext; // skip kalau gagal, lanjut ke berikutnya
      // Timeout 12 detik per script — iOS bisa hang tanpa error/load event
      // kalau SW intercept gagal dan network tidak merespons
      _timer = setTimeout(function() {
        console.warn('[loader] timeout, skip:', src);
        el.onload = el.onerror = null;
        loadNext();
      }, 12000);
      document.head.appendChild(el);
    }
    loadNext();
  })();
</script>
<script>
  // Init notifikasi setelah semua script load
  // Gunakan window 'load' (setelah semua script async selesai) sebagai fallback
  // agar tidak terlewat ketika DOMContentLoaded sudah terlanjur fired
  function _runNotifInit() {
    setTimeout(function() { if (typeof notifInit === 'function') notifInit(); }, 2000);
  }
  if (document.readyState === 'complete') {
    _runNotifInit();
  } else {
    window.addEventListener('load', _runNotifInit);
  }

function showUpdateBanner() {
    var banner = document.getElementById('update-banner');
    if (banner) banner.style.display = 'flex';
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(function(reg) {

      // ── 1. Sudah ada SW waiting sejak awal → langsung skip ──
      if (reg.waiting) {
        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        // controllerchange akan trigger reload otomatis (lihat listener di bawah)
      }

      // ── 2. SW baru ketemu saat install → langsung skip tanpa tunggu user ──
      reg.addEventListener('updatefound', function() {
        var newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', function() {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            newWorker.postMessage({ type: 'SKIP_WAITING' });
            // Tidak perlu showUpdateBanner — controllerchange langsung reload
          }
        });
      });

      // ── 3. Force cek update setiap buka app (setelah listener terpasang) ──
      reg.update();

      // ── 4. Cek ulang saat user kembali ke tab/app (dari background HP) ──
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          reg.update().then(function() {
            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              // controllerchange akan trigger reload otomatis
            }
          }).catch(function(){});
        }
      });

    }).catch(function() {});

    // ── 5. Reload otomatis setelah SW baru take over ──
    var _reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (!_reloading) {
        _reloading = true;
        window.location.reload();
      }
    });
  }

  function _doUpdate() {
    navigator.serviceWorker.getRegistration().then(function(reg) {
      if (reg && reg.waiting) {
        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      } else {
        // Fallback: bersihkan cache manual lalu reload
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            Promise.all(keys.map(function(k) { return caches.delete(k); }))
              .then(function() { window.location.reload(true); });
          });
        } else {
          window.location.reload(true);
        }
      }
    });
  }

  function _dismissUpdate() {
    var banner = document.getElementById('update-banner');
    if (banner) banner.style.display = 'none';
    // Banner akan muncul lagi saat app dibuka ulang / kembali dari background
  }
</script>

<!-- ─── SPLASH SCREEN JS ──────────────────────────────────── -->
<script>
(function() {
  var splash = document.getElementById('zenot-splash');
  var logo   = document.getElementById('splash-logo');
  var text   = document.getElementById('splash-text');
  if (!splash) return;

  // Mulai animasi masuk — langsung tanpa delay
  setTimeout(function() { logo.classList.add('splash-in'); }, 0);
  setTimeout(function() { text.classList.add('splash-in'); }, 180);

  // Fade out & remove setelah 1200ms
  setTimeout(function() {
    splash.classList.add('splash-hide');
    setTimeout(function() {
      splash.style.display = 'none';
    }, 300);
  }, 1200);
})();
</script>
