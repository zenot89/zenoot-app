name: Auto Version Bump

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Generate content hash
        id: hash
        run: |
          HASH=$(cat *.js style.css index.html 2>/dev/null | sha256sum | cut -c1-12)
          BUILD="$(date +%Y%m%d)-${HASH}"
          echo "build=${BUILD}" >> $GITHUB_OUTPUT
          echo "APP_BUILD = ${BUILD}"

      - name: Inject APP_BUILD into index.html
        run: |
          BUILD="${{ steps.hash.outputs.build }}"
          sed -i "/\/\//! s|window\.APP_BUILD = '[^']*';|window.APP_BUILD = '${BUILD}';|" index.html
          echo "index.html updated: APP_BUILD = ${BUILD}"

      - name: Verify APP_BUILD injected
        run: |
          BUILD="${{ steps.hash.outputs.build }}"
          if ! grep -q "window\.APP_BUILD = '${BUILD}';" index.html; then
            echo "APP_BUILD gagal di-inject. Cek pola window.APP_BUILD di index.html."
            exit 1
          fi
          echo "Verified: window.APP_BUILD = '${BUILD}'"

      - name: Commit updated index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan, skip commit."
          else
            git commit -m "chore: auto bump APP_BUILD -> ${{ steps.hash.outputs.build }} [skip ci]"
            git push
          fi
